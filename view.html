<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLAD — View Registrations</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
  :root{
    --plum-950:#1c0a24; --plum-900:#2c0f38; --plum-800:#3d1550;
    --magenta-600:#a21caf; --magenta-500:#c026d3; --magenta-100:#f5d9f7;
    --paper:#fdfaff; --ink:#241129; --ink-soft:#5c4a66; --line:#e4d6ea;
    --err:#b8213d; --radius:10px;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --paper:#150a1a; --ink:#f2e9f5; --ink-soft:#c7b3d1; --line:#3d2a48; }
    :root:not([data-theme="light"]) .stat-total{ color:var(--magenta-100); }
  }
  :root[data-theme="dark"]{ --paper:#150a1a; --ink:#f2e9f5; --ink-soft:#c7b3d1; --line:#3d2a48; }
  :root[data-theme="dark"] .stat-total{ color:var(--magenta-100); }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  header{
    background:linear-gradient(160deg,var(--plum-950),var(--plum-800) 65%,var(--magenta-600));
    padding:28px 24px; color:#fdf4ff; text-align:center;
  }
  header h1{ margin:0 0 4px; font-size:1.3rem; }
  header p{ margin:0; color:var(--magenta-100); font-size:0.9rem; }

  main{ max-width:820px; margin:0 auto; padding:28px 20px 64px; }

  .code-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
  input[type=text]{
    font:inherit; font-size:1rem; padding:11px 13px; border:1.5px solid var(--line);
    border-radius:var(--radius); background:var(--paper); color:var(--ink);
    flex:1; min-width:200px; text-transform:uppercase;
  }
  input:focus{ outline:2px solid var(--magenta-500); outline-offset:1px; border-color:var(--magenta-500); }
  button{
    font:inherit; font-weight:700; font-size:0.95rem; padding:11px 20px; border:none;
    border-radius:999px; background:linear-gradient(120deg,var(--magenta-600),var(--magenta-500));
    color:#fff; cursor:pointer;
  }
  button:disabled{ opacity:0.6; cursor:wait; }

  .msg{ font-size:0.9rem; padding:12px 14px; border-radius:var(--radius); display:none; margin-bottom:16px; }
  .msg.show{ display:block; }
  .msg.err{ background:#fbe6ea; color:var(--err); border:1px solid #f0bcc7; }

  .summary{ font-size:0.9rem; color:var(--ink-soft); margin-bottom:14px; }

  .stat-row{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:16px; }
  .stat-total{ font-size:1.5rem; font-weight:700; color:var(--plum-950); }
  .stat-total span{ font-size:0.85rem; font-weight:500; color:var(--ink-soft); display:block; }

  .export-btn{
    font:inherit; font-weight:700; font-size:0.85rem; padding:9px 16px; border:1.5px solid var(--magenta-600);
    border-radius:999px; background:transparent; color:var(--magenta-600); cursor:pointer;
  }
  .export-btn:disabled{ opacity:0.5; cursor:not-allowed; }

  .region-breakdown{ margin-bottom:18px; }
  .region-breakdown table{ font-size:0.85rem; min-width:0; width:auto; }
  .region-breakdown th, .region-breakdown td{ white-space:normal; }

  .table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); }
  table{ width:100%; border-collapse:collapse; font-size:0.88rem; min-width:640px; }
  th, td{ text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th{ background:var(--magenta-100); color:var(--plum-950); position:sticky; top:0; }
  tr:last-child td{ border-bottom:none; }

  .hidden{ display:none; }
</style>
</head>
<body>

<header>
  <h1>View Registrations</h1>
  <p>Enter your access code to see your scoped list.</p>
</header>

<main>
  <div class="code-row">
    <input type="text" id="code" placeholder="Enter your access code" autocomplete="off" maxlength="20">
    <button id="load-btn">View</button>
  </div>

  <div class="msg err" id="msg"></div>

  <div class="stat-row hidden" id="stat-row">
    <div class="stat-total" id="stat-total"></div>
    <button class="export-btn" id="export-btn" disabled>Export to Excel</button>
  </div>

  <div class="region-breakdown hidden" id="region-breakdown">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Region</th><th>Registrations</th></tr></thead>
        <tbody id="region-breakdown-rows"></tbody>
      </table>
    </div>
  </div>

  <div class="table-wrap hidden" id="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Name</th><th>Mobile</th><th>WhatsApp</th><th>Region</th><th>Wilayat</th><th>Village</th><th>Registered</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<script>
(function(){
  // Same project as index.html — set these to match.
  const SUPABASE_URL = "https://YOUR-PROJECT-REF.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR-ANON-PUBLIC-KEY";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const codeInput = document.getElementById("code");
  const loadBtn = document.getElementById("load-btn");
  const msg = document.getElementById("msg");
  const statRow = document.getElementById("stat-row");
  const statTotal = document.getElementById("stat-total");
  const exportBtn = document.getElementById("export-btn");
  const regionBreakdown = document.getElementById("region-breakdown");
  const regionBreakdownRows = document.getElementById("region-breakdown-rows");
  const tableWrap = document.getElementById("table-wrap");
  const rowsBody = document.getElementById("rows");

  let currentRows = [];   // holds the last-loaded rows, used by Export

  function esc(s){
    const d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function fmtDate(iso){
    try {
      return new Date(iso).toLocaleString(undefined, {
        day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit"
      });
    } catch { return iso; }
  }

  async function loadRegistrations(){
    const code = codeInput.value.trim().toUpperCase();
    msg.className = "msg";
    statRow.className = "stat-row hidden";
    regionBreakdown.className = "region-breakdown hidden";
    tableWrap.className = "table-wrap hidden";
    rowsBody.innerHTML = "";
    regionBreakdownRows.innerHTML = "";
    exportBtn.disabled = true;
    currentRows = [];

    if (!code) {
      msg.className = "msg err show";
      msg.textContent = "Please enter your access code.";
      return;
    }

    loadBtn.disabled = true;
    loadBtn.textContent = "Loading…";

    const { data, error } = await sb.rpc("get_registrations_by_code", { p_code: code });

    loadBtn.disabled = false;
    loadBtn.textContent = "View";

    if (error) {
      msg.className = "msg err show";
      msg.textContent = "Invalid or inactive access code. Please check it and try again.";
      return;
    }

    const rows = data || [];
    currentRows = rows;

    statRow.className = "stat-row";
    statTotal.innerHTML = rows.length + "<span>Total registrations</span>";

    if (rows.length === 0) return;

    exportBtn.disabled = false;

    // Region breakdown only makes sense when more than one region shows up
    // (i.e. the global/Oman in-charge code) — a region-scoped code only ever
    // has one region, so the breakdown would just repeat the total.
    const counts = {};
    rows.forEach(function(r){ counts[r.region] = (counts[r.region] || 0) + 1; });
    const regionNames = Object.keys(counts);
    if (regionNames.length > 1) {
      regionNames.sort(function(a, b){ return counts[b] - counts[a]; });
      regionBreakdownRows.innerHTML = regionNames.map(function(name){
        return "<tr><td>" + esc(name) + "</td><td>" + counts[name] + "</td></tr>";
      }).join("");
      regionBreakdown.className = "region-breakdown";
    }

    tableWrap.className = "table-wrap";
    rowsBody.innerHTML = rows.map(function(r){
      return "<tr>" +
        "<td>" + esc(r.name) + "</td>" +
        "<td>" + esc(r.mobile_no) + "</td>" +
        "<td>" + esc(r.whatsapp_no) + "</td>" +
        "<td>" + esc(r.region) + "</td>" +
        "<td>" + esc(r.wilayat) + "</td>" +
        "<td>" + esc(r.village) + "</td>" +
        "<td>" + esc(fmtDate(r.created_at)) + "</td>" +
      "</tr>";
    }).join("");
  }

  function exportToExcel(){
    if (!currentRows.length) return;

    const sheetData = currentRows.map(function(r){
      return {
        "Name": r.name,
        "Mobile No": r.mobile_no,
        "WhatsApp No": r.whatsapp_no,
        "Region": r.region,
        "Wilayat": r.wilayat,
        "Village": r.village,
        "Registered On": fmtDate(r.created_at)
      };
    });

    const ws = XLSX.utils.json_to_sheet(sheetData);
    ws["!cols"] = [{ wch: 22 }, { wch: 14 }, { wch: 14 }, { wch: 18 }, { wch: 18 }, { wch: 18 }, { wch: 20 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Registrations");

    const today = new Date().toISOString().slice(0, 10);
    const scopeLabel = (codeInput.value.trim() || "registrations").toUpperCase();
    XLSX.writeFile(wb, "glad-registrations-" + scopeLabel + "-" + today + ".xlsx");
  }

  loadBtn.addEventListener("click", loadRegistrations);
  exportBtn.addEventListener("click", exportToExcel);
  codeInput.addEventListener("keydown", function(e){
    if (e.key === "Enter") loadRegistrations();
  });
})();
</script>
</body>
</html>
