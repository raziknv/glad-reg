<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLAD — View Registrations</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<style>
  :root{
    --plum-950:#1c0a24; --plum-900:#2c0f38; --plum-800:#3d1550;
    --magenta-600:#a21caf; --magenta-500:#c026d3; --magenta-100:#f5d9f7;
    --paper:#fdfaff; --ink:#241129; --ink-soft:#5c4a66; --line:#e4d6ea;
    --err:#b8213d; --radius:10px;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --paper:#150a1a; --ink:#f2e9f5; --ink-soft:#c7b3d1; --line:#3d2a48; }
  }
  :root[data-theme="dark"]{ --paper:#150a1a; --ink:#f2e9f5; --ink-soft:#c7b3d1; --line:#3d2a48; }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink); font-family:var(--font-body);
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  header{
    background:linear-gradient(160deg,var(--plum-950),var(--plum-800) 65%,var(--magenta-600));
    padding:28px 24px; color:#fdf4ff; text-align:center;
  }
  header h1{ margin:0 0 4px; font-size:1.3rem; }
  header p{ margin:0; color:var(--magenta-100); font-size:0.9rem; }

  main{ max-width:820px; margin:0 auto; padding:28px 20px 64px; }

  .code-row{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; }
  input[type=text]{
    font:inherit; font-size:1rem; padding:11px 13px; border:1.5px solid var(--line);
    border-radius:var(--radius); background:var(--paper); color:var(--ink);
    flex:1; min-width:200px; text-transform:uppercase;
  }
  input:focus{ outline:2px solid var(--magenta-500); outline-offset:1px; border-color:var(--magenta-500); }
  button{
    font:inherit; font-weight:700; font-size:0.95rem; padding:11px 20px; border:none;
    border-radius:999px; background:linear-gradient(120deg,var(--magenta-600),var(--magenta-500));
    color:#fff; cursor:pointer;
  }
  button:disabled{ opacity:0.6; cursor:wait; }

  .msg{ font-size:0.9rem; padding:12px 14px; border-radius:var(--radius); display:none; margin-bottom:16px; }
  .msg.show{ display:block; }
  .msg.err{ background:#fbe6ea; color:var(--err); border:1px solid #f0bcc7; }

  .summary{ font-size:0.9rem; color:var(--ink-soft); margin-bottom:14px; }

  .table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); }
  table{ width:100%; border-collapse:collapse; font-size:0.88rem; min-width:640px; }
  th, td{ text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th{ background:var(--magenta-100); color:var(--plum-950); position:sticky; top:0; }
  tr:last-child td{ border-bottom:none; }

  .hidden{ display:none; }
</style>
</head>
<body>

<header>
  <h1>View Registrations</h1>
  <p>Enter your access code to see your scoped list.</p>
</header>

<main>
  <div class="code-row">
    <input type="text" id="code" placeholder="Enter your access code" autocomplete="off" maxlength="20">
    <button id="load-btn">View</button>
  </div>

  <div class="msg err" id="msg"></div>
  <div class="summary hidden" id="summary"></div>

  <div class="table-wrap hidden" id="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Name</th><th>Mobile</th><th>WhatsApp</th><th>Region</th><th>Wilayat</th><th>Village</th><th>Registered</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<script>
(function(){
  // Same project as index.html — set these to match.
  const SUPABASE_URL = "https://ooajzhvfrxnladbxrwht.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vYWp6aHZmcnhubGFkYnhyd2h0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5ODQxNDYsImV4cCI6MjEwNTU2MDE0Nn0.wR2zWRoOJf4bSsPJT8dp4xP4WTtfIV5jMQiFJ-NQFsY";

  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const codeInput = document.getElementById("code");
  const loadBtn = document.getElementById("load-btn");
  const msg = document.getElementById("msg");
  const summary = document.getElementById("summary");
  const tableWrap = document.getElementById("table-wrap");
  const rowsBody = document.getElementById("rows");

  function esc(s){
    const d = document.createElement("div");
    d.textContent = s == null ? "" : String(s);
    return d.innerHTML;
  }

  function fmtDate(iso){
    try {
      return new Date(iso).toLocaleString(undefined, {
        day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit"
      });
    } catch { return iso; }
  }

  async function loadRegistrations(){
    const code = codeInput.value.trim();
    msg.className = "msg";
    summary.className = "summary hidden";
    tableWrap.className = "table-wrap hidden";
    rowsBody.innerHTML = "";

    if (!code) {
      msg.className = "msg err show";
      msg.textContent = "Please enter your access code.";
      return;
    }

    loadBtn.disabled = true;
    loadBtn.textContent = "Loading…";

    const { data, error } = await sb.rpc("get_registrations_by_code", { p_code: code });

    loadBtn.disabled = false;
    loadBtn.textContent = "View";

    if (error) {
      msg.className = "msg err show";
      msg.textContent = "Invalid or inactive access code. Please check it and try again.";
      return;
    }

    const rows = data || [];
    summary.className = "summary";
    summary.textContent = rows.length + " registration(s) found.";

    if (rows.length === 0) return;

    tableWrap.className = "table-wrap";
    rowsBody.innerHTML = rows.map(function(r){
      return "<tr>" +
        "<td>" + esc(r.name) + "</td>" +
        "<td>" + esc(r.mobile_no) + "</td>" +
        "<td>" + esc(r.whatsapp_no) + "</td>" +
        "<td>" + esc(r.region) + "</td>" +
        "<td>" + esc(r.wilayat) + "</td>" +
        "<td>" + esc(r.village) + "</td>" +
        "<td>" + esc(fmtDate(r.created_at)) + "</td>" +
      "</tr>";
    }).join("");
  }

  loadBtn.addEventListener("click", loadRegistrations);
  codeInput.addEventListener("keydown", function(e){
    if (e.key === "Enter") loadRegistrations();
  });
})();
</script>
</body>
</html>
